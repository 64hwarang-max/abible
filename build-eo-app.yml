# 어성경 읽기 — 안드로이드 앱(APK) 만들기
# 저장소에 eo-app/index.html 을 올리고, 이 파일을 .github/workflows/build-eo-app.yml 로 두십시오.
# Actions 탭 › "어성경 읽기 APK" › Run workflow 를 누르거나 eo-app/index.html 을 바꾸면 빌드됩니다.
# 서명 키를 고정해 두었으므로 새 APK를 지우지 않고 덮어 설치할 수 있습니다.
name: 어성경 읽기 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'eo-app/**'
      - '.github/workflows/build-eo-app.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 앱 프로젝트 만들기 (Capacitor)
        run: |
          test -f eo-app/index.html || { echo "::error::eo-app/index.html 이 없습니다. 저장소의 eo-app 폴더에 index.html 을 올려 주십시오."; exit 1; }
          mkdir -p eoproj/www
          cp eo-app/index.html eoproj/www/index.html
          cd eoproj
          npm init -y > /dev/null
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 @capacitor/app@^6 @capacitor/share@^6 @capacitor/filesystem@^6
          npx cap init "어성경 읽기" com.everyevry.eoreading --web-dir www
          npx cap add android
          npx cap sync android
